<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Michael Kilpatrick</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .initials {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #2563eb;
      font-size: 32px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .location {
      margin: 0 0 18px;
      color: #cbd5e1;
    }

    .description {
      margin: 0 auto 18px;
      max-width: 340px;
      color: #e2e8f0;
      line-height: 1.55;
    }

    .motto {
      margin: 20px 0 26px;
      color: #93c5fd;
      font-style: italic;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .button {
      display: block;
      padding: 15px 18px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 650;
    }

    .secondary {
      background: #475569;
    }

    .contact-button {
      background: #16a34a;
    }

    .button:active {
      transform: scale(0.98);
    }

    .note {
      margin: 24px 0 0;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="initials">MK</div>

    <h1>Michael Kilpatrick</h1>

    <p class="location">Austin, Texas</p>

    <p class="description">
      Irrigation specialist, turf specialist, Industrial Distribution
      graduate, and home lab enthusiast.
    </p>

    <p class="motto">Always learning. Always building.</p>

    <div class="buttons">
      <a class="button" href="tel:+15126570139">
        Call Michael
      </a>

      <a class="button secondary" href="sms:+15126570139">
        Send a Text
      </a>

      <a class="button secondary" href="mailto:mkilpatrick98@gmail.com">
        Send an Email
      </a>

      <a class="button contact-button" href="michael-kilpatrick.vcf">
        Add to Contacts
      </a>
    </div>

    <p class="note">
      Tap a button to connect.
    </p>
  </main>
</body>
</html>
